<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico">
<title>语音助手</title>
<style>
:root {
  --bg: #0a0a0f;
  --surface: #141420;
  --accent: #6c5ce7;
  --accent-glow: #a29bfe;
  --text: #e0e0f0;
  --text-dim: #8888a0;
  --danger: #e74c3c;
  --ok: #2ecc71;
  --warn: #f39c12;
  --line: rgba(255,255,255,0.1);
  --radius: 20px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f;
  font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  color: var(--text);
  overflow: hidden;
  user-select: none;
}
.widget {
  width: 360px;
  min-height: 560px;
  background: var(--bg);
  border-radius: var(--radius);
  border: 1px solid rgba(108, 92, 231, 0.25);
  box-shadow: 0 0 60px rgba(108, 92, 231, 0.15), 0 8px 32px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0;
  gap: 20px;
  position: relative;
  overflow: hidden;
}
.widget::before {
  content: "";
  position: absolute;
  inset: -40px;
  background: radial-gradient(circle at 50% 30%, rgba(108,92,231,0.12), transparent 70%);
  pointer-events: none;
}
/* 头部可拖动区域 */
.header {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-dim);
  letter-spacing: 0.04em;
  z-index: 10;
  -webkit-app-region: drag;
  padding: 8px 16px;
  height: 40px;
  width: 100%;
}
.header .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 8px var(--ok);
  transition: all 0.3s;
}
.header .dot.off { background: #555; box-shadow: none; }
.header-actions {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  gap: 8px;
  -webkit-app-region: no-drag;
}
.icon-btn {
  width: 28px;
  height: 28px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: rgba(255,255,255,0.04);
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.icon-btn:hover { border-color: rgba(162,155,254,0.5); }
.icon-btn svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
}
#closeBtn {
  border: none;
  background: transparent;
  color: rgba(255,255,255,0.7);
  font-size: 18px;
  font-weight: bold;
  padding: 0;
}
#closeBtn:hover {
  background: rgba(255, 68, 68, 0.3);
  color: #ff4444;
}
.viz-container {
  position: relative;
  width: 200px; height: 200px;
  z-index: 1;
  -webkit-app-region: no-drag;
  border-radius: 50%;
  background:
    radial-gradient(circle at center, rgba(162,155,254,0.28) 0 5px, transparent 6px),
    radial-gradient(circle at center, transparent 0 74px, rgba(162,155,254,0.12) 75px 76px, rgba(108,92,231,0.20) 78px 80px, transparent 82px);
}
canvas#viz {
  width: 200px; height: 200px;
  display: block;
}
.mic-btn {
  width: 72px; height: 72px;
  border-radius: 50%;
  border: 2px solid rgba(108,92,231,0.4);
  background: var(--surface);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s ease;
  z-index: 1;
  -webkit-app-region: no-drag;
  position: relative;
}
.mic-btn:hover {
  border-color: var(--accent);
  box-shadow: 0 0 24px rgba(108,92,231,0.3);
}
.mic-btn.recording {
  border-color: var(--danger);
  box-shadow: 0 0 32px rgba(231,76,60,0.4);
  animation: pulse-btn 1.5s ease-in-out infinite;
}
.mic-btn.processing {
  border-color: #f39c12;
  box-shadow: 0 0 24px rgba(243,156,18,0.3);
}
.mic-btn.listening {
  border-color: var(--ok);
  box-shadow: 0 0 24px rgba(46,204,113,0.22);
}
@keyframes pulse-btn {
  0%, 100% { box-shadow: 0 0 16px rgba(231,76,60,0.3); }
  50% { box-shadow: 0 0 40px rgba(231,76,60,0.6); }
}
.mic-btn svg {
  width: 28px; height: 28px;
  fill: none; stroke: var(--text); stroke-width: 2;
  transition: all 0.25s;
}
.mic-btn.recording svg { stroke: var(--danger); }
.transcript {
  width: 100%;
  max-height: 120px;
  overflow-y: auto;
  font-size: 13px;
  line-height: 1.5;
  z-index: 1;
  -webkit-app-region: no-drag;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 0 16px;
  user-select: text;
}
.transcript .msg {
  padding: 8px 12px;
  border-radius: 12px;
  max-width: 90%;
  word-break: break-word;
  user-select: text;
}
.transcript .msg.user {
  align-self: flex-end;
  background: rgba(108,92,231,0.2);
  border: 1px solid rgba(108,92,231,0.3);
}
.transcript .msg.assistant {
  align-self: flex-start;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
}
.status {
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.03em;
  z-index: 1;
  text-align: center;
  min-height: 16px;
  transition: color 0.3s;
  padding-bottom: 20px;
}
.status.recording { color: var(--danger); }
.status.processing { color: #f39c12; }
.status.listening { color: var(--ok); }
.text-composer {
  width: calc(100% - 32px);
  min-height: 42px;
  display: grid;
  grid-template-columns: 1fr 42px;
  gap: 8px;
  z-index: 1;
  -webkit-app-region: no-drag;
}
.text-composer textarea {
  width: 100%;
  min-height: 42px;
  max-height: 92px;
  resize: none;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255,255,255,0.05);
  color: var(--text);
  padding: 9px 10px;
  font: inherit;
  font-size: 12px;
  line-height: 1.35;
  outline: none;
  user-select: text;
}
.text-composer textarea:focus {
  border-color: rgba(162,155,254,0.55);
}
.send-btn {
  width: 42px;
  min-height: 42px;
  border: 1px solid rgba(162,155,254,0.45);
  border-radius: 8px;
  background: rgba(108,92,231,0.22);
  color: var(--text);
  cursor: pointer;
  font: inherit;
}
.send-btn:hover {
  border-color: rgba(162,155,254,0.8);
}
.send-btn:disabled {
  opacity: 0.45;
  cursor: default;
}
body.edge-docked {
  background: #0b0f24;
  overflow: hidden;
}
body.edge-docked .widget {
  width: 88px;
  min-height: 88px;
  height: 88px;
  gap: 0;
  justify-content: center;
  border-radius: 50%;
  padding: 0;
  background: transparent;
  border: 0;
  box-shadow: none;
  overflow: visible;
}
body.edge-docked .widget::before {
  display: none;
}
body.edge-docked .header,
body.edge-docked .transcript,
body.edge-docked .text-composer,
body.edge-docked .status,
body.edge-docked .panel,
body.edge-docked .modal {
  display: none;
}
body.edge-docked .mic-btn {
  display: none;
}
body.edge-docked .viz-container {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 88px;
  height: 88px;
  background:
    radial-gradient(circle at center, rgba(210,207,255,0.95) 0 4px, rgba(114,97,255,0.82) 5px 8px, transparent 9px),
    radial-gradient(circle at center, transparent 0 31px, rgba(95,211,255,0.28) 32px 33px, rgba(108,92,231,0.54) 34px 37px, transparent 38px),
    linear-gradient(145deg, rgba(11,15,36,0.98), rgba(21,15,48,0.98));
  border: 1px solid rgba(163,220,255,0.28);
  box-shadow: 0 0 22px rgba(95,211,255,0.18), 0 10px 28px rgba(0,0,0,0.38);
  animation: docked-orb-pulse 1.8s ease-in-out infinite;
  transition: border-color 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
  -webkit-app-region: drag;
  cursor: grab;
}
body.edge-docked .viz-container:active {
  cursor: grabbing;
}
body.edge-docked .viz-container::after {
  content: "";
  position: absolute;
  inset: 7px;
  border-radius: 50%;
  border: 1px solid rgba(162,155,254,0.20);
  pointer-events: none;
}
body.edge-docked canvas#viz {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  flex: 0 0 auto;
  -webkit-app-region: drag;
}
@keyframes docked-orb-pulse {
  0%, 100% { transform: scale(0.96); opacity: 0.78; }
  50% { transform: scale(1.04); opacity: 1; }
}
body.edge-docked.hover-listening .viz-container,
body.edge-docked.state-listening .viz-container {
  border-color: rgba(46,204,113,0.62);
  box-shadow: 0 0 24px rgba(46,204,113,0.28), 0 10px 28px rgba(0,0,0,0.38);
  filter: saturate(1.16);
}
body.edge-docked.state-recording .viz-container {
  border-color: rgba(231,76,60,0.68);
  box-shadow: 0 0 30px rgba(231,76,60,0.34), 0 10px 28px rgba(0,0,0,0.38);
  animation: docked-recording-pulse 0.82s ease-in-out infinite;
}
body.edge-docked.state-processing .viz-container {
  border-color: rgba(243,156,18,0.72);
  box-shadow: 0 0 26px rgba(243,156,18,0.30), 0 10px 28px rgba(0,0,0,0.38);
  animation: docked-processing-pulse 1.1s ease-in-out infinite;
}
@keyframes docked-recording-pulse {
  0%, 100% { transform: scale(0.98); filter: saturate(1.2); }
  50% { transform: scale(1.08); filter: saturate(1.55); }
}
@keyframes docked-processing-pulse {
  0%, 100% { transform: scale(0.98) rotate(0deg); }
  50% { transform: scale(1.04) rotate(4deg); }
}
.panel, .modal {
  position: absolute;
  inset: 0;
  z-index: 20;
  background: rgba(10,10,15,0.96);
  backdrop-filter: blur(14px);
  -webkit-app-region: no-drag;
}
.panel.hidden, .modal.hidden { display: none; }
.panel {
  padding: 18px 18px 88px;
  overflow-y: auto;
}
.panel-head, .modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.panel-title, .modal-title {
  font-size: 15px;
  font-weight: 600;
}
.settings-group {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 12px;
}
.settings-group h2 {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  margin-bottom: 10px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 10px;
  font-size: 12px;
  color: var(--text-dim);
}
.field.row {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
}
.field-note {
  font-size: 11px;
  line-height: 1.35;
  color: var(--text-dim);
}
.profile-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
}
.profile-card {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255,255,255,0.04);
  color: var(--text);
  cursor: pointer;
  padding: 10px;
  text-align: left;
  font: inherit;
}
.profile-card.active {
  border-color: rgba(162,155,254,0.9);
  background: rgba(108,92,231,0.22);
  box-shadow: 0 0 16px rgba(108,92,231,0.16);
}
.profile-card.unavailable {
  border-color: rgba(243,156,18,0.35);
}
.profile-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 600;
}
.profile-badge {
  border-radius: 999px;
  border: 1px solid rgba(162,155,254,0.55);
  color: var(--accent-glow);
  font-size: 10px;
  padding: 2px 7px;
}
.profile-card:not(.active) .profile-badge {
  display: none;
}
.profile-desc {
  margin-top: 5px;
  color: var(--text-dim);
  font-size: 11px;
  line-height: 1.35;
}
.profile-capability {
  margin-top: 6px;
  color: var(--text-dim);
  font-size: 10px;
  line-height: 1.3;
}
.profile-card.unavailable .profile-capability {
  color: var(--warn);
}
.runtime-strip {
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  background: rgba(255,255,255,0.04);
  padding: 9px 10px;
  font-size: 12px;
  color: var(--text);
  line-height: 1.4;
  white-space: pre-line;
}
.runtime-strip.warn {
  border-color: rgba(243,156,18,0.5);
  background: rgba(243,156,18,0.12);
}
.advanced-toggle {
  width: 100%;
  min-height: 30px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255,255,255,0.04);
  color: var(--text);
  cursor: pointer;
  font: inherit;
}
.advanced-settings.hidden { display: none; }
.option-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
  margin-top: 6px;
}
.option-button {
  min-height: 42px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255,255,255,0.04);
  color: var(--text);
  cursor: pointer;
  padding: 7px 8px;
  text-align: left;
  font: inherit;
}
.option-button.active {
  border-color: rgba(162,155,254,0.9);
  background: rgba(108,92,231,0.22);
}
.option-button.unavailable {
  color: var(--text-dim);
}
.option-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
}
.option-meta {
  display: block;
  margin-top: 3px;
  font-size: 10px;
  line-height: 1.25;
  color: var(--text-dim);
}
.option-button.active .option-meta {
  color: var(--accent-glow);
}
select, input[type="text"], input[type="number"] {
  width: 100%;
  min-height: 32px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.06);
  color: var(--text);
  padding: 6px 8px;
  font: inherit;
}
select {
  color-scheme: dark;
}
select option {
  background: #12131c;
  color: #f4f1ff;
}
select option:checked {
  background: #342a70;
  color: #ffffff;
}
input[type="range"] { width: 100%; }
input[type="checkbox"] { width: 16px; height: 16px; }
.actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  position: sticky;
  bottom: 0;
  padding: 10px 0 4px;
  background: linear-gradient(to top, rgba(10,10,15,1), rgba(10,10,15,0.92));
  z-index: 30;
}
.text-btn {
  flex: 1;
  min-height: 34px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.06);
  color: var(--text);
  cursor: pointer;
  font: inherit;
}
.text-btn.primary {
  border-color: rgba(108,92,231,0.6);
  background: rgba(108,92,231,0.28);
}
.check-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.check-item {
  display: grid;
  grid-template-columns: 10px 1fr;
  gap: 8px;
  align-items: start;
  font-size: 12px;
  color: var(--text-dim);
}
.check-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-top: 5px;
  background: #555;
}
.check-dot.ok { background: var(--ok); box-shadow: 0 0 8px rgba(46,204,113,0.6); }
.check-dot.warn { background: var(--warn); box-shadow: 0 0 8px rgba(243,156,18,0.5); }
.check-main { color: var(--text); }
.check-sub {
  margin-top: 2px;
  line-height: 1.35;
  word-break: break-all;
}
.modal {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
}
.modal-box {
  width: 100%;
  border: 1px solid rgba(108,92,231,0.28);
  border-radius: 12px;
  background: rgba(20,20,32,0.94);
  padding: 16px;
}
</style>
</head>
<body>

<div class="widget">
  <div class="header pywebview-drag-region">
    <span class="dot" id="statusDot"></span>
    <span>语音助手</span>
    <div class="header-actions">
      <button class="icon-btn" id="settingsBtn" title="设置">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 .9-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5.9h.1a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
        </svg>
      </button>
      <button class="icon-btn" id="closeBtn" title="最小化到托盘">×</button>
    </div>
  </div>

  <div class="viz-container">
    <canvas id="viz" width="200" height="200"></canvas>
  </div>

  <button class="mic-btn" id="micBtn" title="按住说话，松开发送">
    <svg viewBox="0 0 24 24">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-6 6.92V22h-2v-3.08A7 7 0 0 1 5 12v-2"/>
    </svg>
  </button>

  <div class="transcript" id="transcript"></div>
  <form class="text-composer" id="textComposer">
    <textarea id="textInput" rows="1" placeholder="粘贴文字，回车发送"></textarea>
    <button class="send-btn" id="sendTextBtn" type="submit" title="发送文字">发送</button>
  </form>
  <div class="status" id="status">按住说话，松开发送</div>

  <div class="panel hidden" id="settingsPanel">
    <div class="panel-head">
      <div class="panel-title">设置</div>
      <button class="icon-btn" id="closeSettingsBtn" title="关闭">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </button>
    </div>

    <div class="settings-group">
      <h2>诊断</h2>
      <div class="check-list" id="diagList"></div>
    </div>

    <div class="settings-group">
      <h2>音频</h2>
      <label class="field">输入设备<select id="inputDevice"></select></label>
      <label class="field">输出设备<select id="outputDevice"></select></label>
      <label class="field">输入增益<input id="inputGain" type="range" min="0.5" max="3" step="0.1"></label>
      <label class="field">输出音量<input id="outputVolume" type="range" min="0.2" max="2" step="0.1"></label>
      <label class="field">VAD 阈值<input id="vadThreshold" type="range" min="0.002" max="0.04" step="0.001"></label>
      <label class="field">免按键停顿提交<input id="handsFreeSilence" type="range" min="0.5" max="1.2" step="0.05"></label>
    </div>

    <div class="settings-group">
      <h2>模型</h2>
      <input id="performanceProfile" type="hidden" value="lightweight">
      <div class="profile-grid">
        <button class="profile-card" id="profileLightweight" type="button" data-profile="lightweight">
          <div class="profile-title"><span>轻量兼容</span><span class="profile-badge">已选</span></div>
          <div class="profile-desc">适配绝大多数机器，使用 CPU 小模型，启动稳、资源占用低。</div>
        </button>
        <button class="profile-card" id="profileExtremeGpu" type="button" data-profile="extreme_gpu">
          <div class="profile-title"><span>GPU 快速响应</span><span class="profile-badge">已选</span></div>
          <div class="profile-desc">使用 small / cuda / float16。比 large-v3 更快，日常中文对话够用。</div>
          <div class="profile-capability" id="profileExtremeGpuCapability">正在检测 NVIDIA CUDA...</div>
        </button>
      </div>
      <div class="runtime-strip" id="runtimeProfileStatus">当前运行状态读取中...</div>
      <button class="advanced-toggle" id="advancedToggle" type="button">高级参数</button>
      <div class="advanced-settings hidden" id="advancedSettings">
        <label class="field">STT 模型
          <input id="sttModel" type="hidden" value="base">
          <div class="option-grid" id="sttModelOptions"></div>

        <label class="field">STT 设备
          <input id="sttDevice" type="hidden" value="cpu">
          <div class="option-grid" id="sttDeviceOptions"></div>
        </label>
        <label class="field">STT 精度
          <input id="sttComputeType" type="hidden" value="int8">
          <div class="option-grid" id="sttComputeOptions"></div>
        </label>
        <label class="field">TTS 模式
          <input id="ttsMode" type="hidden" value="edge_mp3">
          <div class="option-grid" id="ttsModeOptions"></div>
        </label>
        <label class="field">自然语音音色<input id="ttsVoice" type="text"></label>
        <label class="field">Windows 原生音色<input id="ttsNativeVoice" type="text"></label>
        <label class="field">Hermes 地址<input id="hermesBaseUrl" type="text"></label>
        <label class="field">Hermes 模型<input id="hermesModel" type="text"></label>
        <label class="field">最大回复 tokens<input id="hermesMaxTokens" type="number" min="64" max="4096" step="32"></label>
        <label class="field">温度<input id="hermesTemperature" type="number" min="0" max="2" step="0.1"></label>
      </div>
    </div>

    <div class="settings-group">
      <h2>窗口</h2>
      <label class="field row">免按键监听<input id="handsFree" type="checkbox"></label>
      <label class="field row">唤醒词门控<input id="wakeWordEnabled" type="checkbox"></label>
      <label class="field">唤醒词<input id="wakeWords" type="text"></label>

          <svg viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"></path></svg>
        </button>
      </div>
      <div class="check-list" id="setupChecks"></div>

        <button class="text-btn" id="setupRefreshBtn">重新检测</button>
        <button class="text-btn primary" id="completeSetupBtn">完成</button>

<script src="/api/config.js"></script>
<script>
var appConfig = window.VOICE_WIDGET_CONFIG || { host: location.hostname || "127.0.0.1", port: location.port || 8765 };
var ws = new WebSocket("ws://" + appConfig.host + ":" + appConfig.port + "/ws");
var state = "idle"; // idle | recording | processing
var chatHistory = []; // 多轮对话历史
var settingsData = null;
var devicesData = { inputs: [], outputs: [] };
var statusData = null;
var performanceProfiles = {};
var sttModelOptions = ["tiny", "base", "small", "medium", "large-v3"];
var sttDeviceOptions = ["cpu", "cuda", "auto"];
var sttComputeOptions = ["int8", "int8_float16", "float16", "auto"];
var ttsModeOptions = ["edge_mp3", "windows_native"];
var assistantDraftDiv = null;
var assistantDraftText = "";
var handsFreeMode = false;
var lastHandsFreeSent = null;
var recordingSource = null;
var globalHotkeyWasHandsFree = false;
var hoverListeningActive = false;
var hoverStopPending = false;
var textInputComposing = false;

ws.onopen = () => {
  console.log("WS connected");
  lastHandsFreeSent = null;
  if (settingsData && settingsData.ui) {
    syncHandsFreeMode(!!settingsData.ui.hands_free);
  }
};
ws.onclose = () => {
  console.log("WS closed");
  setStatus("连接已断开");
};

ws.onmessage = (e) => {
  const msg = JSON.parse(e.data);
  switch (msg.type) {
    case "level":
      updateViz(msg.rms);
      break;
    case "status":
      setState(msg.state);
      break;
    case "result":
      addMessage("user", msg.user);
      addMessage("assistant", msg.assistant);
      break;
    case "user_transcript":
      assistantDraftDiv = null;
      assistantDraftText = "";
      addMessage("user", msg.text);
      break;
    case "assistant_delta":
      appendAssistantDelta(msg.delta || "");
      break;
    case "assistant_done":
      finishAssistantMessage(msg.assistant || assistantDraftText);
      break;
    case "wake_ignored":
      setStatus("等待唤醒词...");
      break;
    case "wake_prompt":
      setStatus(msg.text || "我在，请说。");
      break;
    case "error":
      setStatus("错误: " + msg.message);
      if (String(msg.message || "").indexOf("免按键") >= 0) {
        lastHandsFreeSent = null;
        handsFreeMode = false;
        if ($("handsFree")) $("handsFree").checked = false;
      }
      setState("idle");
      break;
  }
};

function $(id) {
  return document.getElementById(id);
}

function apiGet(path) {
  return fetch(path, { cache: "no-store" }).then(function(response) {
    if (!response.ok) throw new Error(response.statusText);
    return response.json();
  });
}

function apiPost(path, payload) {
  return fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload || {})
  }).then(function(response) {
    if (!response.ok) throw new Error(response.statusText);
    return response.json();
  });
}

function boolText(value) {
  return value ? "正常" : "待处理";
}

function checkItem(label, ok, detail) {
  return {
    label: label,
    ok: !!ok,
    detail: detail || boolText(ok)
  };
}

function collectChecks() {
  var deps = (statusData && statusData.dependencies) || {};
  var hermes = (statusData && statusData.hermes) || {};
  var stt = (statusData && statusData.stt) || {};
  var accelerator = (statusData && statusData.accelerator) || {};
  var profile = (settingsData && settingsData.performance && settingsData.performance.profile) || "lightweight";
  var configuredStt = (settingsData && settingsData.stt) || {};
  var cudaRequested = profile === "extreme_gpu" || configuredStt.device === "cuda";
  var sttOk = !!(statusData && statusData.stt_ready && !stt.fallback);
  return [
    checkItem("性能档位", true, profileLabel(profile)),
    checkItem("NVIDIA CUDA", !cudaRequested || !!accelerator.nvidia_cuda_available, accelerator.message || "未检测"),
    checkItem("ffmpeg", deps.ffmpeg, deps.ffmpeg_path || "未检测到"),
    checkItem("麦克风", devicesData.inputs.length > 0, devicesData.inputs.length + " 个输入设备"),
    checkItem("扬声器", devicesData.outputs.length > 0, devicesData.outputs.length + " 个输出设备"),
    checkItem("Hermes Gateway", hermes.reachable, hermes.base_url || "未配置"),
    checkItem(
      "STT",
      sttOk,
      stt.model ? stt.model + " / " + stt.device + " / " + stt.compute_type : "模型预热中或失败"
    ),
    checkItem("TTS", statusData && statusData.tts_ready, statusData && statusData.tts_ready ? "语音已就绪" : "模型预热中或失败")
  ];
}

function renderChecks(containerId) {
  var container = $(containerId);
  if (!container) return;
  var checks = collectChecks();
  container.innerHTML = "";
  checks.forEach(function(item) {
    var row = document.createElement("div");
    row.className = "check-item";
    var dot = document.createElement("span");
    dot.className = "check-dot " + (item.ok ? "ok" : "warn");
    var text = document.createElement("div");
    var main = document.createElement("div");
    main.className = "check-main";
    main.textContent = item.label;
    var sub = document.createElement("div");
    sub.className = "check-sub";
    sub.textContent = item.detail;
    text.appendChild(main);
    text.appendChild(sub);
    row.appendChild(dot);
    row.appendChild(text);
    container.appendChild(row);
  });
}

function fillDeviceSelect(select, devices, currentValue) {
  select.innerHTML = "";
  var defaultOption = document.createElement("option");
  defaultOption.value = "";
  defaultOption.textContent = "自动选择";
  select.appendChild(defaultOption);
  devices.forEach(function(device) {
    var option = document.createElement("option");
    option.value = String(device.index);
    option.textContent = device.index + " - " + device.name;
    select.appendChild(option);
  });
  select.value = currentValue === null || currentValue === undefined ? "" : String(currentValue);
}

function renderSettings() {
  if (!settingsData) return;
  var performance = settingsData.performance || {};
  var audio = settingsData.audio || {};
  var stt = settingsData.stt || {};
  var tts = settingsData.tts || {};
  var hermes = settingsData.hermes || {};
  var ui = settingsData.ui || {};

  $("performanceProfile").value = performance.profile || "lightweight";
  renderPerformanceCards();
  renderRuntimeProfileStatus();
  fillDeviceSelect($("inputDevice"), devicesData.inputs, audio.input_device);
  fillDeviceSelect($("outputDevice"), devicesData.outputs, audio.output_device);
  $("inputGain").value = audio.input_gain || 1;
  $("outputVolume").value = audio.output_volume || 1;
  $("vadThreshold").value = audio.vad_threshold || 0.012;
  $("handsFreeSilence").value = audio.hands_free_silence_seconds || 0.75;
  $("sttModel").value = stt.model || "base";
  $("sttDevice").value = stt.device || "cpu";
  $("sttComputeType").value = stt.compute_type || "int8";
  renderAdvancedOptions();
  $("ttsMode").value = tts.mode || "edge_mp3";
  $("ttsVoice").value = tts.voice || "zh-CN-XiaoxiaoNeural";
  $("ttsNativeVoice").value = tts.native_voice || "Microsoft Huihui Desktop";
  renderTtsModeOptions();
  $("hermesBaseUrl").value = hermes.base_url || "http://127.0.0.1:8642";
  $("hermesModel").value = hermes.model || "hermes";
  $("hermesMaxTokens").value = hermes.max_tokens || 300;
  $("hermesTemperature").value = hermes.temperature || 0.7;
  $("handsFree").checked = !!ui.hands_free;
  handsFreeMode = !!ui.hands_free;
  $("wakeWordEnabled").checked = !!ui.wake_word_enabled;
  $("wakeWords").value = ui.wake_words || "小赫,赫尔墨斯,Hermes";
  $("wakeReply").value = ui.wake_reply || "我在，大王请说。";
  $("alwaysOnTop").checked = !!ui.always_on_top;
  $("globalHotkeyEnabled").checked = ui.global_hotkey_enabled !== false;
  $("globalHotkey").value = ui.global_hotkey || "Ctrl+Alt+Space";
  $("edgeDockEnabled").checked = !!ui.edge_dock_enabled;
  $("edgeHoverListen").checked = !!ui.edge_hover_listen;
  $("startMinimized").checked = !!ui.start_minimized;
}

function profileLabel(profileName) {
  if (profileName === "custom") return "自定义";
  return profileName === "extreme_gpu" ? "GPU 快速响应" : "轻量兼容";
}

function hasNvidiaCuda() {
  return !!(statusData && statusData.accelerator && statusData.accelerator.nvidia_cuda_available);
}

function formatSttLine(stt) {
  stt = stt || {};
  return (stt.model || "-") + " / " + (stt.device || "-") + " / " + (stt.compute_type || "-");
}

function renderPerformanceCards() {
  var profileName = $("performanceProfile").value || "lightweight";
  document.querySelectorAll(".profile-card").forEach(function(card) {
    card.classList.toggle("active", card.dataset.profile === profileName);
  });
  var gpuCard = $("profileExtremeGpu");
  var gpuHint = $("profileExtremeGpuCapability");
  var accelerator = (statusData && statusData.accelerator) || {};
  if (gpuCard && gpuHint) {
    var available = hasNvidiaCuda();
    gpuCard.classList.toggle("unavailable", !available);
    gpuHint.textContent = available
      ? "已检测到 NVIDIA CUDA，可尝试此档。"
      : "当前不可用：需要 NVIDIA CUDA，选择后可能自动回退 CPU。";
    if (accelerator.message && !available) {
      gpuHint.textContent = accelerator.message;
    }
  }
}

function renderRuntimeProfileStatus() {
  var box = $("runtimeProfileStatus");
  var stt = (statusData && statusData.stt) || {};
  var settingsStt = (settingsData && settingsData.stt) || {};
  var configured = stt.configured || settingsStt;
  var accelerator = (statusData && statusData.accelerator) || {};
  var profileName = $("performanceProfile").value || "lightweight";
  var parts = [
    "已选择：" + profileLabel(profileName),
    "配置 STT：" + formatSttLine(configured),
    "实际 STT：" + formatSttLine(stt),
    "NVIDIA CUDA：" + (accelerator.nvidia_cuda_available ? "已检测到" : "未检测到")
  ];
  if (stt.fallback) {
    box.classList.add("warn");
    parts.push("已自动回退：" + (stt.fallback_reason || "GPU 不可用，当前使用轻量 CPU。"));
    if (stt.last_error) parts.push("原因：" + stt.last_error);
  } else {
    box.classList.remove("warn");
    parts.push(statusData && statusData.stt_ready ? "STT 已就绪" : "STT 预热中");
  }
  box.textContent = parts.join("\n");
}

function sttModelInfo(name) {
  var models = (statusData && statusData.stt_models) || [];
  for (var i = 0; i < models.length; i++) {
    if (models[i].name === name) return models[i];
  }
  return null;
}

function renderOptionButtons(containerId, inputId, values, metaFn) {
  var container = $(containerId);
  var input = $(inputId);
  if (!container || !input) return;
  container.innerHTML = "";
  values.forEach(function(value) {
    var button = document.createElement("button");
    var meta = metaFn ? metaFn(value) : "";
    button.type = "button";
    button.className = "option-button" + (input.value === value ? " active" : "");
    if (meta.indexOf("未下载") >= 0) button.className += " unavailable";
    button.dataset.value = value;

    var label = document.createElement("span");
    label.className = "option-label";
    label.textContent = value;
    var detail = document.createElement("span");
    detail.className = "option-meta";
    detail.textContent = meta;
    button.appendChild(label);
    button.appendChild(detail);
    button.addEventListener("click", function() {
      input.value = value;
      $("performanceProfile").value = profileFromForm();
      renderPerformanceCards();
      renderRuntimeProfileStatus();
      renderAdvancedOptions();
      renderTtsModeOptions();
    });
    container.appendChild(button);
  });
}

function ttsModeLabel(value) {
  return value === "windows_native" ? "极速朗读" : "自然语音";
}

function renderTtsModeOptions() {
  renderOptionButtons("ttsModeOptions", "ttsMode", ttsModeOptions, function(value) {
    if (value === "windows_native") return "Windows 原生，低延迟";
    return "edge-tts / MP3，更自然";
  });
}

function renderAdvancedOptions() {
  renderOptionButtons("sttModelOptions", "sttModel", sttModelOptions, function(value) {
    var info = sttModelInfo(value);
    if (info && info.current) return "当前运行";
    if (info && info.downloaded) return "已下载";
    return "未下载";
  });
  renderOptionButtons("sttDeviceOptions", "sttDevice", sttDeviceOptions, function(value) {
    if (value === "cuda") return hasNvidiaCuda() ? "使用 NVIDIA GPU" : "需要 NVIDIA CUDA，当前可能回退 CPU";
    if (value === "auto") return "自动判断";
    return "稳定兼容";
  });
  renderOptionButtons("sttComputeOptions", "sttComputeType", sttComputeOptions, function(value) {
    if (value === "float16") return "GPU 快速";
    if (value === "int8_float16") return "折中";
    if (value === "auto") return "自动判断";
    return "CPU 省资源";
  });
}

function profileMatchesForm(profileName) {
  var profile = performanceProfiles[profileName];
  if (!profile) return false;
  var stt = profile.stt || {};
  var hermes = profile.hermes || {};
  return (
    $("sttModel").value === String(stt.model || "") &&
    $("sttDevice").value === String(stt.device || "") &&
    $("sttComputeType").value === String(stt.compute_type || "") &&
    $("hermesModel").value.trim() === String(hermes.model || "hermes") &&
    Number($("hermesMaxTokens").value) === Number(hermes.max_tokens || 300) &&
    Number($("hermesTemperature").value) === Number(hermes.temperature || 0.7)
  );
}

function profileFromForm() {
  if (profileMatchesForm("lightweight")) return "lightweight";
  if (profileMatchesForm("extreme_gpu")) return "extreme_gpu";
  return "custom";
}

function applyProfileToForm() {
  var profile = performanceProfiles[$("performanceProfile").value];
  if (!profile) return;
  if (profile.stt) {
    $("sttModel").value = profile.stt.model || "base";
    $("sttDevice").value = profile.stt.device || "cpu";
    $("sttComputeType").value = profile.stt.compute_type || "int8";
  }
  if (profile.hermes) {
    $("hermesModel").value = profile.hermes.model || "hermes";
    $("hermesMaxTokens").value = profile.hermes.max_tokens || 300;
    $("hermesTemperature").value = profile.hermes.temperature || 0.7;
  }
  renderPerformanceCards();
  renderRuntimeProfileStatus();
  renderAdvancedOptions();
}

function selectPerformanceProfile(profileName) {
  $("performanceProfile").value = profileName;
  applyProfileToForm();
  setStatus("正在切换到: " + profileLabel(profileName));
  saveSettings(false, true);
}

function deviceValue(id) {
  var value = $(id).value;
  return value === "" ? null : Number(value);
}

function numberValue(id, fallback) {
  var value = Number($(id).value);
  return Number.isFinite(value) ? value : fallback;
}

function readSettingsForm(applyProfile) {
  var profileName = applyProfile ? $("performanceProfile").value : profileFromForm();
  return {
    performance: {
      profile: profileName,
      apply_profile: !!applyProfile
    },
    audio: {
      input_device: deviceValue("inputDevice"),
      output_device: deviceValue("outputDevice"),
      input_gain: Number($("inputGain").value),
      output_volume: Number($("outputVolume").value),
      vad_threshold: Number($("vadThreshold").value),
      hands_free_silence_seconds: Number($("handsFreeSilence").value)
    },
    stt: {
      model: $("sttModel").value,
      device: $("sttDevice").value,
      compute_type: $("sttComputeType").value
    },
    tts: {
      mode: $("ttsMode").value || "edge_mp3",
      voice: $("ttsVoice").value.trim() || "zh-CN-XiaoxiaoNeural",
      native_voice: $("ttsNativeVoice").value.trim() || "Microsoft Huihui Desktop"
    },
    hermes: {
      base_url: $("hermesBaseUrl").value.trim() || "http://127.0.0.1:8642",
      model: $("hermesModel").value.trim() || "hermes",
      max_tokens: numberValue("hermesMaxTokens", 300),
      temperature: numberValue("hermesTemperature", 0.7)
    },
    ui: {
      hands_free: $("handsFree").checked,
      wake_word_enabled: $("wakeWordEnabled").checked,
      wake_words: $("wakeWords").value.trim() || "小赫,赫尔墨斯,Hermes",
      wake_reply: $("wakeReply").value.trim() || "我在，大王请说。",
      always_on_top: $("alwaysOnTop").checked,
      global_hotkey_enabled: $("globalHotkeyEnabled").checked,
      global_hotkey: $("globalHotkey").value || "Ctrl+Alt+Space",
      edge_dock_enabled: $("edgeDockEnabled").checked,
      edge_hover_listen: $("edgeHoverListen").checked,
      start_minimized: $("startMinimized").checked
    }
  };
}

function syncHandsFreeMode(enabled, options) {
  options = options || {};
  handsFreeMode = !!enabled;
  var forceSend = !!options.force || !!options.submitActive;
  if (!forceSend && lastHandsFreeSent === handsFreeMode) return;
  if (ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({
      cmd: "set_hands_free",
      enabled: handsFreeMode,
      submit_active: !!options.submitActive
    }));
    lastHandsFreeSent = handsFreeMode;
  }
}

function refreshStatus() {
  return Promise.all([
    apiGet("/api/status"),
    apiGet("/api/devices").catch(function() { return { inputs: [], outputs: [] }; })
  ]).then(function(results) {
    statusData = results[0];
    performanceProfiles = statusData.performance_profiles || {};
    devicesData = results[1];
    settingsData = statusData.settings;
    renderChecks("diagList");
    renderChecks("setupChecks");
    renderSettings();
    syncHandsFreeMode(!!(settingsData && settingsData.ui && settingsData.ui.hands_free));
    if (settingsData && settingsData.setup && !settingsData.setup.first_run_complete) {
      $("setupModal").classList.remove("hidden");
    }
  }).catch(function(error) {
    setStatus("诊断失败: " + error.message);
  });
}

function openSettings() {
  $("settingsPanel").classList.remove("hidden");
  refreshStatus();
}

function closeSettings() {
  $("settingsPanel").classList.add("hidden");
}

function saveSettings(closePanel, applyProfile) {
  closePanel = closePanel === false ? false : true;
  applyProfile = applyProfile === true;
  apiPost("/api/settings", readSettingsForm(applyProfile)).then(function(saved) {
    settingsData = saved;
    setStatus("设置已保存");
    syncHandsFreeMode(!!(settingsData.ui && settingsData.ui.hands_free));
    if (closePanel !== false) closeSettings();
    refreshStatus();
  }).catch(function(error) {
    setStatus("保存失败: " + error.message);
  });
}

function completeSetup() {
  apiPost("/api/setup/complete", {}).then(function(saved) {
    settingsData = saved;
    $("setupModal").classList.add("hidden");
  }).catch(function(error) {
    setStatus("诊断向导失败: " + error.message);
  });
}

function setState(s) {
  state = s;
  if (hoverStopPending && s !== "recording") {
    hoverStopPending = false;
    syncHandsFreeMode(false);
  }
  document.body.classList.remove("state-idle", "state-recording", "state-processing", "state-listening");
  document.body.classList.add("state-" + s);
  const btn = document.getElementById("micBtn");
  const dot = document.getElementById("statusDot");
  const status = document.getElementById("status");
  btn.classList.remove("recording", "processing", "listening");
  dot.classList.remove("off");
  status.classList.remove("recording", "processing", "listening");

  if (s === "recording") {
    btn.classList.add("recording");
    status.textContent = "正在聆听...";
    status.classList.add("recording");
  } else if (s === "processing") {
    btn.classList.add("processing");
    status.textContent = "处理中...";
    status.classList.add("processing");
  } else if (s === "listening") {
    btn.classList.add("listening");
    var wakeOn = settingsData && settingsData.ui && settingsData.ui.wake_word_enabled;
    status.textContent = wakeOn ? "等待唤醒词..." : "免按键监听中...";
    status.classList.add("listening");
  } else {
    dot.classList.add("off");
    status.textContent = handsFreeMode ? "免按键监听已关闭" : "按住说话，松开发送";
  }
}

function setStatus(text) {
  document.getElementById("status").textContent = text;
}

function addMessage(role, text) {
  chatHistory.push({ role, content: text });
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  const container = document.getElementById("transcript");
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function appendAssistantDelta(delta) {
  if (!delta) return;
  const container = document.getElementById("transcript");
  if (!assistantDraftDiv) {
    assistantDraftDiv = document.createElement("div");
    assistantDraftDiv.className = "msg assistant";
    container.appendChild(assistantDraftDiv);
  }
  assistantDraftText += delta;
  assistantDraftDiv.textContent = assistantDraftText;
  container.scrollTop = container.scrollHeight;
}

function finishAssistantMessage(text) {
  const finalText = text || assistantDraftText;
  if (!assistantDraftDiv && finalText) {
    appendAssistantDelta(finalText);
  } else if (assistantDraftDiv) {
    assistantDraftDiv.textContent = finalText;
  }
  if (finalText) {
    chatHistory.push({ role: "assistant", content: finalText });
  }
  assistantDraftDiv = null;
  assistantDraftText = "";
}

const micBtn = document.getElementById("micBtn");
let isPressing = false;

function canStartRecording(force) {
  return (!!force || !handsFreeMode) && (state === "idle" || state === "processing" || state === "listening");
}

function requestStartRecording(source, force) {
  if (!canStartRecording(force)) return;
  isPressing = true;
  recordingSource = source || "manual";
  setState("recording");
  ws.send(JSON.stringify({ cmd: "start_record" }));
}

function requestStopRecording(source) {
  if (state === "recording" && isPressing && (!source || recordingSource === source)) {
    isPressing = false;
    recordingSource = null;
    ws.send(JSON.stringify({ cmd: "stop_record", history: chatHistory }));
  }
}

function isEditableTarget(target) {
  if (!target) return false;
  var tag = String(target.tagName || "").toLowerCase();
  return tag === "input" || tag === "textarea" || target.isContentEditable;
}

// 鼠标按下开始录音
micBtn.addEventListener("mousedown", () => {
  requestStartRecording("mouse", false);
});
// 鼠标松开停止录音，发送请求
micBtn.addEventListener("mouseup", () => {
  requestStopRecording("mouse");
});
micBtn.addEventListener("mouseleave", () => {
  requestStopRecording("mouse");
});
// 空格键快捷支持
document.addEventListener("keydown", (e) => {
  if (isEditableTarget(e.target) || e.isComposing || textInputComposing) return;
  if (e.code === "Space" && !e.repeat && canStartRecording()) {
    e.preventDefault();
    requestStartRecording("keyboard", false);
  }
});
document.addEventListener("keyup", (e) => {
  if (isEditableTarget(e.target) || e.isComposing || textInputComposing) return;
  if (e.code === "Space" && recordingSource === "keyboard") {
    e.preventDefault();
    requestStopRecording("keyboard");
  }
});

function resizeTextInput() {
  const input = document.getElementById("textInput");
  input.style.height = "42px";
  input.style.height = Math.min(input.scrollHeight, 92) + "px";
}

function submitTextMessage() {
  const input = document.getElementById("textInput");
  const text = input.value.trim();
  if (!text || ws.readyState !== WebSocket.OPEN || state === "recording") return;
  input.value = "";
  resizeTextInput();
  setState("processing");
  ws.send(JSON.stringify({ cmd: "text_message", text: text, history: chatHistory }));
}

document.getElementById("textComposer").addEventListener("submit", (e) => {
  e.preventDefault();
  if (textInputComposing) return;
  submitTextMessage();
});
document.getElementById("textInput").addEventListener("input", resizeTextInput);
document.getElementById("textInput").addEventListener("compositionstart", () => {
  textInputComposing = true;
});
document.getElementById("textInput").addEventListener("compositionend", () => {
  textInputComposing = false;
  resizeTextInput();
});
document.getElementById("textInput").addEventListener("keydown", (e) => {
  if (e.isComposing || textInputComposing) return;
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    submitTextMessage();
  }
});

window.hermesGlobalHotkeyDown = function() {
  if (recordingSource === "global") return;
  globalHotkeyWasHandsFree = handsFreeMode;
  if (handsFreeMode) syncHandsFreeMode(false);
  requestStartRecording("global", true);
};

window.hermesGlobalHotkeyUp = function() {
  requestStopRecording("global");
  if (globalHotkeyWasHandsFree) {
    globalHotkeyWasHandsFree = false;
    window.setTimeout(function() {
      var persistentHandsFree = !!(settingsData && settingsData.ui && settingsData.ui.hands_free);
      if (state !== "recording" && (persistentHandsFree || hoverListeningActive)) {
        syncHandsFreeMode(true);
      }
    }, 650);
  }
};

window.hermesSetDocked = function(enabled) {
  document.body.classList.toggle("edge-docked", !!enabled);
  if (enabled) closeSettings();
};

window.hermesSetHoverListening = function(enabled) {
  enabled = !!enabled;
  if (hoverListeningActive === enabled) return;
  hoverListeningActive = enabled;
  document.body.classList.toggle("hover-listening", enabled);
  if (enabled) {
    if (state !== "recording") syncHandsFreeMode(true);
  } else {
    var persistentHandsFree = !!(settingsData && settingsData.ui && settingsData.ui.hands_free);
    if (persistentHandsFree) {
      hoverStopPending = false;
      return;
    }
    if (state === "recording" && recordingSource !== "global" && recordingSource !== "keyboard" && recordingSource !== "mouse") {
      hoverStopPending = false;
      syncHandsFreeMode(false, { submitActive: true, force: true });
    } else {
      hoverStopPending = false;
      syncHandsFreeMode(false);
    }
  }
};
document.getElementById("viz").addEventListener("dblclick", async function() {
  if (!document.body.classList.contains("edge-docked")) return;
  try {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.show_main_window) {
      await window.pywebview.api.show_main_window();
    }
  } catch (error) {
    console.error(error);
  }
});
// 关闭按钮逻辑
document.getElementById("closeBtn").addEventListener("click", async () => {
  try {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.hide_window) {
      const result = await window.pywebview.api.hide_window();
      if (!result || result.ok) return;
      throw new Error(result.message || "隐藏窗口失败");
    }
    window.close();
  } catch (error) {
    console.error(error);
    setStatus("隐藏失败: " + (error.message || error));
  }
});
$("settingsBtn").addEventListener("click", openSettings);
$("profileLightweight").addEventListener("click", function() { selectPerformanceProfile("lightweight"); });
$("profileExtremeGpu").addEventListener("click", function() { selectPerformanceProfile("extreme_gpu"); });
$("advancedToggle").addEventListener("click", function() {
  $("advancedSettings").classList.toggle("hidden");
});
$("closeSettingsBtn").addEventListener("click", closeSettings);
$("refreshStatusBtn").addEventListener("click", refreshStatus);
$("saveSettingsBtn").addEventListener("click", function() { saveSettings(true, false); });
$("setupRefreshBtn").addEventListener("click", refreshStatus);
$("completeSetupBtn").addEventListener("click", completeSetup);
$("skipSetupBtn").addEventListener("click", completeSetup);
refreshStatus();
// ── 声纹可视化 ────────────────────────────────────────────
const canvas = document.getElementById("viz");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;
const CX = W / 2;
const CY = H / 2;
let currentLevel = 0;
let targetLevel = 0;
let vizHistory = [];
for (let i = 0; i < 120; i++) vizHistory.push(0.18);

function updateViz(rms) {
  targetLevel = Math.min(1, rms * 14);
}

function draw() {
  requestAnimationFrame(draw);

  // 空闲呼吸动画
  const t = performance.now();
  const idleWave = 0.20 + 0.08 * Math.sin(t * 0.002);
  const effectiveLevel = targetLevel > 0.025 ? Math.max(currentLevel, 0.18) : idleWave;

  currentLevel += (targetLevel - currentLevel) * 0.3;
  vizHistory.push(effectiveLevel);
  if (vizHistory.length > 120) vizHistory.shift();

  ctx.clearRect(0, 0, W, H);

  // 外层光晕
  const glowRadius = 92 + effectiveLevel * 18;
  const glow = ctx.createRadialGradient(CX, CY, 18, CX, CY, glowRadius);
  glow.addColorStop(0, "rgba(108,92,231,0)");
  glow.addColorStop(0.6, "rgba(108,92,231," + (0.16 + effectiveLevel * 0.22) + ")");
  glow.addColorStop(1, "rgba(108,92,231,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // 基础圆环
  ctx.beginPath();
  ctx.arc(CX, CY, 54, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(162,155,254,0.45)";
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // 声纹柱状条
  const bars = 96;
  const baseRadius = 52;
  const maxHeight = 42;

  for (let i = 0; i < bars; i++) {
    const angle = (i / bars) * Math.PI * 2 - Math.PI / 2;
    const histIdx = Math.floor((i / bars) * vizHistory.length);
    const h = vizHistory[Math.min(histIdx, vizHistory.length - 1)];
    const idlePattern = 0.35 + 0.65 * Math.abs(Math.sin(angle * 6 + t * 0.0018));
    const audioPattern = 0.68 + 0.32 * Math.abs(Math.sin(angle * 3 + t * 0.004));
    const barHeight = (18 + h * maxHeight) * idlePattern * audioPattern;
    const innerR = baseRadius - barHeight * 0.36;
    const outerR = baseRadius + barHeight;
    const x1 = CX + Math.cos(angle) * innerR;
    const y1 = CY + Math.sin(angle) * innerR;
    const x2 = CX + Math.cos(angle) * outerR;
    const y2 = CY + Math.sin(angle) * outerR;
    const intensity = h;
    const colorPulse = 0.5 + 0.5 * Math.sin(angle * 2 + t * 0.001);
    const r = Math.floor(80 + colorPulse * 80);
    const g = Math.floor(180 + intensity * 60);
    const b = 255;
    const alpha = 0.72 + intensity * 0.28;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.stroke();
  }

  // 中心圆点
  const dotSize = 6 + effectiveLevel * 8;
  const dotGrad = ctx.createRadialGradient(CX, CY, 0, CX, CY, dotSize * 2);
  dotGrad.addColorStop(0, "rgba(162,155,254," + (0.7 + effectiveLevel * 0.3) + ")");
  dotGrad.addColorStop(1, "rgba(108,92,231,0)");
  ctx.beginPath();
  ctx.arc(CX, CY, dotSize * 2, 0, Math.PI * 2);
  ctx.fillStyle = dotGrad;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(CX, CY, dotSize, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(162,155,254," + (0.85 + effectiveLevel * 0.15) + ")";
  ctx.fill();
}
draw();
</script>
