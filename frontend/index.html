<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Widget</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #141420;
    --accent: #6c5ce7;
    --accent-glow: #a29bfe;
    --text: #e0e0f0;
    --text-dim: #8888a0;
    --danger: #e74c3c;
    --ok: #2ecc71;
    --warn: #f39c12;
    --line: rgba(255,255,255,0.1);
    --radius: 20px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    overflow: hidden;
    user-select: none;
  }
  .widget {
    width: 320px;
    min-height: 480px;
    background: var(--bg);
    border-radius: var(--radius);
    border: 1px solid rgba(108, 92, 231, 0.25);
    box-shadow: 0 0 60px rgba(108, 92, 231, 0.15), 0 8px 32px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 20px;
    gap: 20px;
    position: relative;
    overflow: hidden;
  }
  .widget::before {
    content: "";
    position: absolute;
    inset: -40px;
    background: radial-gradient(circle at 50% 30%, rgba(108,92,231,0.12), transparent 70%);
    pointer-events: none;
  }
  .header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    z-index: 1;
    -webkit-app-region: drag;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 8px var(--ok);
    transition: all 0.3s;
  }
  .header .dot.off { background: #555; box-shadow: none; }
  .icon-btn {
    width: 28px; height: 28px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-app-region: no-drag;
  }
  .icon-btn:hover { border-color: rgba(162,155,254,0.5); }
  .icon-btn svg {
    width: 16px; height: 16px;
    fill: none; stroke: currentColor; stroke-width: 2;
  }
  .viz-container {
    position: relative;
    width: 200px; height: 200px;
    z-index: 1;
    -webkit-app-region: no-drag;
    border-radius: 50%;
    background: rgba(8, 8, 18, 0.28);
  }
  canvas#viz {
    width: 200px; height: 200px;
    display: block;
  }
  .mic-btn {
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 2px solid rgba(108,92,231,0.4);
    background: var(--surface);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    z-index: 1;
    -webkit-app-region: no-drag;
    position: relative;
  }
  .mic-btn:hover {
    border-color: var(--accent);
    box-shadow: 0 0 24px rgba(108,92,231,0.3);
  }
  .mic-btn.recording {
    border-color: var(--danger);
    box-shadow: 0 0 32px rgba(231,76,60,0.4);
    animation: pulse-btn 1.5s ease-in-out infinite;
  }
  .mic-btn.processing {
    border-color: #f39c12;
    box-shadow: 0 0 24px rgba(243,156,18,0.3);
  }
  @keyframes pulse-btn {
    0%, 100% { box-shadow: 0 0 16px rgba(231,76,60,0.3); }
    50% { box-shadow: 0 0 40px rgba(231,76,60,0.6); }
  }
  .mic-btn svg {
    width: 28px; height: 28px;
    fill: none; stroke: var(--text); stroke-width: 2;
    transition: all 0.25s;
  }
  .mic-btn.recording svg { stroke: var(--danger); }
  .transcript {
    width: 100%;
    max-height: 120px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.5;
    z-index: 1;
    -webkit-app-region: no-drag;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .transcript .msg {
    padding: 8px 12px;
    border-radius: 12px;
    max-width: 90%;
    word-break: break-word;
  }
  .transcript .msg.user {
    align-self: flex-end;
    background: rgba(108,92,231,0.2);
    border: 1px solid rgba(108,92,231,0.3);
  }
  .transcript .msg.assistant {
    align-self: flex-start;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .status {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
    z-index: 1;
    text-align: center;
    min-height: 16px;
    transition: color 0.3s;
  }
  .status.recording { color: var(--danger); }
  .status.processing { color: #f39c12; }
  .panel, .modal {
    position: absolute;
    inset: 0;
    z-index: 5;
    background: rgba(10,10,15,0.96);
    backdrop-filter: blur(14px);
    -webkit-app-region: no-drag;
  }
  .panel.hidden, .modal.hidden { display: none; }
  .panel {
    padding: 18px;
    overflow-y: auto;
  }
  .panel-head, .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .panel-title, .modal-title {
    font-size: 15px;
    font-weight: 600;
  }
  .settings-group {
    border-top: 1px solid var(--line);
    padding-top: 12px;
    margin-top: 12px;
  }
  .settings-group h2 {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 10px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .field.row {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }
  select, input[type="text"], input[type="number"] {
    width: 100%;
    min-height: 32px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.06);
    color: var(--text);
    padding: 6px 8px;
    font: inherit;
  }
  input[type="range"] { width: 100%; }
  input[type="checkbox"] { width: 16px; height: 16px; }
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .text-btn {
    flex: 1;
    min-height: 34px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.06);
    color: var(--text);
    cursor: pointer;
    font: inherit;
  }
  .text-btn.primary {
    border-color: rgba(108,92,231,0.6);
    background: rgba(108,92,231,0.28);
  }
  .check-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .check-item {
    display: grid;
    grid-template-columns: 10px 1fr;
    gap: 8px;
    align-items: start;
    font-size: 12px;
    color: var(--text-dim);
  }
  .check-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-top: 5px;
    background: #555;
  }
  .check-dot.ok { background: var(--ok); box-shadow: 0 0 8px rgba(46,204,113,0.6); }
  .check-dot.warn { background: var(--warn); box-shadow: 0 0 8px rgba(243,156,18,0.5); }
  .check-main { color: var(--text); }
  .check-sub {
    margin-top: 2px;
    line-height: 1.35;
    word-break: break-all;
  }
  .modal {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
  }
  .modal-box {
    width: 100%;
    border: 1px solid rgba(108,92,231,0.28);
    border-radius: 12px;
    background: rgba(20,20,32,0.94);
    padding: 16px;
  }
</style>
</head>
<body>

<div class="widget">
  <div class="header">
    <div class="brand">
      <span class="dot" id="statusDot"></span>
      <span>语音助手</span>
    </div>
    <button class="icon-btn" id="settingsBtn" title="设置">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 .9-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5.9h.1a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
      </svg>
    </button>
  </div>

  <div class="viz-container">
    <canvas id="viz" width="200" height="200"></canvas>
  </div>

  <button class="mic-btn" id="micBtn" title="点击说话">
    <svg viewBox="0 0 24 24">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-6 6.92V22h-2v-3.08A7 7 0 0 1 5 12v-2"/>
    </svg>
  </button>

  <div class="transcript" id="transcript"></div>
  <div class="status" id="status">按住说话，松开发送</div>

  <div class="panel hidden" id="settingsPanel">
    <div class="panel-head">
      <div class="panel-title">设置</div>
      <button class="icon-btn" id="closeSettingsBtn" title="关闭">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </button>
    </div>

    <div class="settings-group">
      <h2>诊断</h2>
      <div class="check-list" id="diagList"></div>
    </div>

    <div class="settings-group">
      <h2>音频</h2>
      <label class="field">输入设备<select id="inputDevice"></select></label>
      <label class="field">输出设备<select id="outputDevice"></select></label>
      <label class="field">输入增益<input id="inputGain" type="range" min="0.5" max="3" step="0.1"></label>
      <label class="field">输出音量<input id="outputVolume" type="range" min="0.2" max="2" step="0.1"></label>
      <label class="field">VAD 阈值<input id="vadThreshold" type="range" min="0.002" max="0.04" step="0.001"></label>
    </div>

    <div class="settings-group">
      <h2>模型</h2>
      <label class="field">STT 模型
        <select id="sttModel">
          <option value="tiny">tiny</option>
          <option value="base">base</option>
          <option value="small">small</option>
          <option value="medium">medium</option>
        </select>
      </label>
      <label class="field">TTS 音色<input id="ttsVoice" type="text"></label>
      <label class="field">Hermes 地址<input id="hermesBaseUrl" type="text"></label>
    </div>

    <div class="settings-group">
      <h2>窗口</h2>
      <label class="field row">窗口置顶<input id="alwaysOnTop" type="checkbox"></label>
      <label class="field row">启动后隐藏<input id="startMinimized" type="checkbox"></label>
    </div>

    <div class="actions">
      <button class="text-btn" id="refreshStatusBtn">重新检测</button>
      <button class="text-btn primary" id="saveSettingsBtn">保存</button>
    </div>
  </div>

  <div class="modal hidden" id="setupModal">
    <div class="modal-box">
      <div class="modal-head">
        <div class="modal-title">首次启动诊断</div>
        <button class="icon-btn" id="skipSetupBtn" title="完成">
          <svg viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"></path></svg>
        </button>
      </div>
      <div class="check-list" id="setupChecks"></div>
      <div class="actions">
        <button class="text-btn" id="setupRefreshBtn">重新检测</button>
        <button class="text-btn primary" id="completeSetupBtn">完成</button>
      </div>
    </div>
  </div>
</div>

<script src="/api/config.js"></script>
<script>
var appConfig = window.VOICE_WIDGET_CONFIG || { host: location.hostname || "127.0.0.1", port: location.port || 8765 };
var ws = new WebSocket("ws://" + appConfig.host + ":" + appConfig.port + "/ws");
var state = "idle";
var settingsData = null;
var devicesData = { inputs: [], outputs: [] };
var statusData = null;

ws.onopen = function() { console.log("WS connected"); };
ws.onclose = function() {
  console.log("WS closed");
  setStatus("连接已断开");
};

ws.onmessage = function(e) {
  var msg = JSON.parse(e.data);
  switch (msg.type) {
    case "level":
      updateViz(msg.rms);
      break;
    case "status":
      setState(msg.state);
      break;
    case "result":
      addMessage("user", msg.user);
      addMessage("assistant", msg.assistant);
      break;
    case "error":
      setStatus("错误: " + msg.message);
      setState("idle");
      break;
  }
};

function $(id) {
  return document.getElementById(id);
}

function apiGet(path) {
  return fetch(path, { cache: "no-store" }).then(function(response) {
    if (!response.ok) throw new Error(response.statusText);
    return response.json();
  });
}

function apiPost(path, payload) {
  return fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload || {})
  }).then(function(response) {
    if (!response.ok) throw new Error(response.statusText);
    return response.json();
  });
}

function boolText(value) {
  return value ? "正常" : "待处理";
}

function checkItem(label, ok, detail) {
  return {
    label: label,
    ok: !!ok,
    detail: detail || boolText(ok)
  };
}

function collectChecks() {
  var deps = (statusData && statusData.dependencies) || {};
  var hermes = (statusData && statusData.hermes) || {};
  return [
    checkItem("ffmpeg", deps.ffmpeg, deps.ffmpeg_path || "未检测到"),
    checkItem("麦克风", devicesData.inputs.length > 0, devicesData.inputs.length + " 个输入设备"),
    checkItem("扬声器", devicesData.outputs.length > 0, devicesData.outputs.length + " 个输出设备"),
    checkItem("Hermes Gateway", hermes.reachable, hermes.base_url || "未配置"),
    checkItem("STT", statusData && statusData.stt_ready, statusData && statusData.stt_ready ? "模型已就绪" : "模型预热中或失败"),
    checkItem("TTS", statusData && statusData.tts_ready, statusData && statusData.tts_ready ? "语音已就绪" : "语音预热中或失败")
  ];
}

function renderChecks(containerId) {
  var container = $(containerId);
  if (!container) return;
  var checks = collectChecks();
  container.innerHTML = "";
  checks.forEach(function(item) {
    var row = document.createElement("div");
    row.className = "check-item";
    var dot = document.createElement("span");
    dot.className = "check-dot " + (item.ok ? "ok" : "warn");
    var text = document.createElement("div");
    var main = document.createElement("div");
    main.className = "check-main";
    main.textContent = item.label;
    var sub = document.createElement("div");
    sub.className = "check-sub";
    sub.textContent = item.detail;
    text.appendChild(main);
    text.appendChild(sub);
    row.appendChild(dot);
    row.appendChild(text);
    container.appendChild(row);
  });
}

function fillDeviceSelect(select, devices, currentValue) {
  select.innerHTML = "";
  var defaultOption = document.createElement("option");
  defaultOption.value = "";
  defaultOption.textContent = "系统默认";
  select.appendChild(defaultOption);
  devices.forEach(function(device) {
    var option = document.createElement("option");
    option.value = String(device.index);
    option.textContent = device.name;
    select.appendChild(option);
  });
  select.value = currentValue === null || currentValue === undefined ? "" : String(currentValue);
}

function renderSettings() {
  if (!settingsData) return;
  var audio = settingsData.audio || {};
  var stt = settingsData.stt || {};
  var tts = settingsData.tts || {};
  var hermes = settingsData.hermes || {};
  var ui = settingsData.ui || {};

  fillDeviceSelect($("inputDevice"), devicesData.inputs, audio.input_device);
  fillDeviceSelect($("outputDevice"), devicesData.outputs, audio.output_device);
  $("inputGain").value = audio.input_gain || 1;
  $("outputVolume").value = audio.output_volume || 1;
  $("vadThreshold").value = audio.vad_threshold || 0.012;
  $("sttModel").value = stt.model || "base";
  $("ttsVoice").value = tts.voice || "zh-CN-XiaoxiaoNeural";
  $("hermesBaseUrl").value = hermes.base_url || "http://127.0.0.1:8642";
  $("alwaysOnTop").checked = !!ui.always_on_top;
  $("startMinimized").checked = !!ui.start_minimized;
}

function deviceValue(id) {
  var value = $(id).value;
  return value === "" ? null : Number(value);
}

function readSettingsForm() {
  return {
    audio: {
      input_device: deviceValue("inputDevice"),
      output_device: deviceValue("outputDevice"),
      input_gain: Number($("inputGain").value),
      output_volume: Number($("outputVolume").value),
      vad_threshold: Number($("vadThreshold").value)
    },
    stt: {
      model: $("sttModel").value
    },
    tts: {
      voice: $("ttsVoice").value.trim() || "zh-CN-XiaoxiaoNeural"
    },
    hermes: {
      base_url: $("hermesBaseUrl").value.trim() || "http://127.0.0.1:8642"
    },
    ui: {
      always_on_top: $("alwaysOnTop").checked,
      start_minimized: $("startMinimized").checked
    }
  };
}

function refreshStatus() {
  return Promise.all([
    apiGet("/api/status"),
    apiGet("/api/devices").catch(function() { return { inputs: [], outputs: [] }; })
  ]).then(function(results) {
    statusData = results[0];
    devicesData = results[1];
    settingsData = statusData.settings;
    renderChecks("diagList");
    renderChecks("setupChecks");
    renderSettings();
    if (settingsData && settingsData.setup && !settingsData.setup.first_run_complete) {
      $("setupModal").classList.remove("hidden");
    }
  }).catch(function(error) {
    setStatus("诊断失败: " + error.message);
  });
}

function openSettings() {
  $("settingsPanel").classList.remove("hidden");
  refreshStatus();
}

function closeSettings() {
  $("settingsPanel").classList.add("hidden");
}

function saveSettings() {
  apiPost("/api/settings", readSettingsForm()).then(function(saved) {
    settingsData = saved;
    setStatus("设置已保存");
    closeSettings();
    refreshStatus();
  }).catch(function(error) {
    setStatus("保存失败: " + error.message);
  });
}

function completeSetup() {
  apiPost("/api/setup/complete", {}).then(function(saved) {
    settingsData = saved;
    $("setupModal").classList.add("hidden");
  }).catch(function(error) {
    setStatus("诊断向导失败: " + error.message);
  });
}

function setState(s) {
  state = s;
  var btn = $("micBtn");
  var dot = $("statusDot");
  var status = $("status");
  btn.classList.remove("recording", "processing");
  dot.classList.remove("off");
  status.classList.remove("recording", "processing");

  if (s === "recording") {
    btn.classList.add("recording");
    status.textContent = "正在聆听...";
    status.classList.add("recording");
  } else if (s === "processing") {
    btn.classList.add("processing");
    status.textContent = "处理中...";
    status.classList.add("processing");
  } else {
    dot.classList.add("off");
    status.textContent = "按住说话，松开发送";
  }
}

function setStatus(text) {
  $("status").textContent = text;
}

function addMessage(role, text) {
  var div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  var container = $("transcript");
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function startTalk() {
  if (state === "idle") {
    ws.send(JSON.stringify({ cmd: "start_record" }));
  }
}

function stopTalk() {
  if (state === "recording") {
    ws.send(JSON.stringify({ cmd: "stop_record" }));
  }
}

var micBtn = $("micBtn");
micBtn.addEventListener("pointerdown", function(event) {
  event.preventDefault();
  micBtn.setPointerCapture(event.pointerId);
  startTalk();
});
micBtn.addEventListener("pointerup", function(event) {
  event.preventDefault();
  stopTalk();
});
micBtn.addEventListener("pointercancel", stopTalk);
micBtn.addEventListener("lostpointercapture", stopTalk);

document.addEventListener("keydown", function(event) {
  if (event.code === "Space" && !event.repeat) {
    event.preventDefault();
    startTalk();
  }
});
document.addEventListener("keyup", function(event) {
  if (event.code === "Space") {
    event.preventDefault();
    stopTalk();
  }
});

$("settingsBtn").addEventListener("click", openSettings);
$("closeSettingsBtn").addEventListener("click", closeSettings);
$("refreshStatusBtn").addEventListener("click", refreshStatus);
$("saveSettingsBtn").addEventListener("click", saveSettings);
$("setupRefreshBtn").addEventListener("click", refreshStatus);
$("completeSetupBtn").addEventListener("click", completeSetup);
$("skipSetupBtn").addEventListener("click", completeSetup);
refreshStatus();

// ── Voice Visualization ────────────────────────────────────────────
var canvas = document.getElementById("viz");
var ctx = canvas.getContext("2d");
var W = canvas.width;
var H = canvas.height;
var CX = W / 2;
var CY = H / 2;
var currentLevel = 0;
var targetLevel = 0;
var levelHistory = [];
for (var i = 0; i < 120; i++) levelHistory.push(0.18);

function updateViz(rms) {
  targetLevel = Math.min(1, rms * 14);
}

function draw() {
  requestAnimationFrame(draw);

  // Idle breathing when no mic input
  var t = performance.now();
  var idleWave = 0.30 + 0.10 * Math.sin(t * 0.002);
  var effectiveLevel = targetLevel > 0.025 ? Math.max(currentLevel, 0.18) : idleWave;

  currentLevel += (targetLevel - currentLevel) * 0.3;
  levelHistory.push(effectiveLevel);
  if (levelHistory.length > 120) levelHistory.shift();

  ctx.clearRect(0, 0, W, H);

  // ── outer glow ──
  var glowRadius = 92 + effectiveLevel * 18;
  var glow = ctx.createRadialGradient(CX, CY, 18, CX, CY, glowRadius);
  glow.addColorStop(0, "rgba(108,92,231,0)");
  glow.addColorStop(0.6, "rgba(108,92,231," + (0.16 + effectiveLevel * 0.22) + ")");
  glow.addColorStop(1, "rgba(108,92,231,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // ── base ring ──
  ctx.beginPath();
  ctx.arc(CX, CY, 54, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(120,230,255,0.24)";
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // ── waveform bars ──
  var bars = 96;
  var baseRadius = 52;
  var maxHeight = 42;

  for (var i = 0; i < bars; i++) {
    var angle = (i / bars) * Math.PI * 2 - Math.PI / 2;
    var histIdx = Math.floor((i / bars) * levelHistory.length);
    var h = levelHistory[Math.min(histIdx, levelHistory.length - 1)];
    var idlePattern = 0.35 + 0.65 * Math.abs(Math.sin(angle * 6 + t * 0.0018));
    var audioPattern = 0.68 + 0.32 * Math.abs(Math.sin(angle * 3 + t * 0.004));
    var barHeight = (18 + h * maxHeight) * idlePattern * audioPattern;
    var innerR = baseRadius - barHeight * 0.36;
    var outerR = baseRadius + barHeight;
    var x1 = CX + Math.cos(angle) * innerR;
    var y1 = CY + Math.sin(angle) * innerR;
    var x2 = CX + Math.cos(angle) * outerR;
    var y2 = CY + Math.sin(angle) * outerR;
    var intensity = h;
    var colorPulse = 0.5 + 0.5 * Math.sin(angle * 2 + t * 0.001);
    var r = Math.floor(80 + colorPulse * 80);
    var g = Math.floor(180 + intensity * 60);
    var b = 255;
    var alpha = 0.82 + intensity * 0.18;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.stroke();
  }

  // ── center dot ──
  var dotSize = 6 + effectiveLevel * 8;
  var dotGrad = ctx.createRadialGradient(CX, CY, 0, CX, CY, dotSize * 2);
  dotGrad.addColorStop(0, "rgba(162,155,254," + (0.7 + effectiveLevel * 0.3) + ")");
  dotGrad.addColorStop(1, "rgba(108,92,231,0)");
  ctx.beginPath();
  ctx.arc(CX, CY, dotSize * 2, 0, Math.PI * 2);
  ctx.fillStyle = dotGrad;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(CX, CY, dotSize, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(162,155,254," + (0.85 + effectiveLevel * 0.15) + ")";
  ctx.fill();
}
draw();
</script>
</body>
